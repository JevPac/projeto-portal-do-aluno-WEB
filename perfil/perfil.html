<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Meu Perfil | UFAC</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="perfil.css">

</head>

<body>



    <div class="perfil-app">

        <header class="perfil-nav">

            <a href="index.html" class="link-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar</a>

            <img src="../imagens/logo.png" alt="Logo UFAC">

        </header>



        <main class="perfil-scroll">

            <div class="perfil-grid">

                <section class="card-perfil">

                    <div class="avatar-container">

                        <div id="preview-avatar" class="avatar-preview">

                            <i class="fa-solid fa-user-circle"></i>

                        </div>

                        <label for="input-foto" class="btn-editar-foto">

                            <i class="fa-solid fa-camera"></i>

                        </label>

                        <input type="file" id="input-foto" accept="image/*" onchange="previewFoto(event)"
                            style="display: none;">

                    </div>



                    <h1>Sávio Monteiro dos Santos</h1>

                    <span class="badge">Aluno Regular</span>



                    <div class="info-bloco">

                        <h3>Dados Pessoais</h3>

                        <p><i class="fa-solid fa-id-card"></i> <strong>CPF:</strong> 123.456.789-00</p>

                        <p><i class="fa-solid fa-graduation-cap"></i> <strong>Matrícula:</strong> 2026101010</p>

                        <p><i class="fa-solid fa-envelope"></i> <strong>E-mail:</strong> savio.santos@ufac.br</p>

                    </div>



                    <div class="info-bloco">

                        <h3>Endereço</h3>

                        <p><i class="fa-solid fa-location-dot"></i> Rua Exemplo, 123 - Centro<br>Rio Branco, Acre</p>

                    </div>

                </section>



                <section class="card-form">

                    <h2>Gerenciamento de Conta</h2>

                    <div class="campo"><label>Nome Completo</label><input type="text" id="nome"
                            value="Sávio Monteiro dos Santos"></div>

                    <div class="campo"><label>E-mail Pessoal</label><input type="email" id="email"
                            value="savio.monteiro@email.com"></div>

                    <div class="campo"><label>Telefone</label><input type="text" id="tel" value="(68) 99999-9999"></div>

                    <div class="campo"><label>Endereço Atual</label><input type="text" id="end"
                            value="Rua Exemplo, 123"></div>



                    <div class="botoes">

                        <button class="btn-azul" onclick="salvarPerfil()">Salvar Alterações</button>

                        <button class="btn-azul-outline"
                            onclick="window.location.href='../pagina incial/esqueci_minha_senha/index.html'">Alterar
                            Senha</button>

                    </div>

                </section>

            </div>

        </main>

    </div>



    <script>

        function previewFoto(event) {

            const file = event.target.files[0];

            if (file) {

                const reader = new FileReader();

                reader.onload = function (e) {

                    const preview = document.getElementById('preview-avatar');

                    preview.innerHTML = `<img src="${e.target.result}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;">`;

                }

                reader.readAsDataURL(file);

            }

        }

        function salvarPerfil() { alert("Dados de " + document.getElementById('nome').value + " atualizados!"); }

    </script>

</body>

</html>
