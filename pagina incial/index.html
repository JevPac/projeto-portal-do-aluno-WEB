<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal do Aluno UFAC</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main-container">

        <header>
            <img src="C:\Users\WEB2026\OneDrive\Área de Trabalho\projeto-portal-do-aluno-WEB\pagina incial\imagens\ChatGPT Image 25 de mai. de 2026, 16_22_53.png"
                alt="Logo da UFAC">
        </header>

        <main>

            <section class="caixa-login">
                <h2>Acesso ao Portal</h2>

                <form>
                    <div class="grupo-input">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" placeholder="123.456.789-00" required>
                    </div>

                    <div class="grupo-input">
                        <label for="senha">Senha:</label>
                        <div class="input-container" style="position: relative;">
                            <input type="password" id="senha" placeholder="••••••••••" required>
                            <button type="button" id="toggleSenha"
                                style="position: absolute; right: 15px; top: 11px; border: none; background: none; cursor: pointer; padding: 0;">
                                <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512"
                                    style="width: 18px; height: 18px;">
                                    <path fill="#2c4f87"
                                        d="M572.52 241.4C518.29 135.59 410.93 64 288 64S57.71 135.59 3.48 241.4a32.35 32.35 0 0 0 0 29.19C57.71 376.41 165.07 448 288 448s230.29-71.59 284.52-177.41a32.35 32.35 0 0 0 0-29.19zM288 400a144 144 0 1 1 144-144 143.84 143.84 0 0 1-144 144zm0-240a95.33 95.33 0 0 0-25.31 3.79 47.85 47.85 0 0 1-66.9 66.9A95.78 95.78 0 1 0 288 160z">
                                    </path>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="grupo-checkbox">
                        <input type="checkbox" id="lembrar">
                        <label for="lembrar">Lembrar-me</label>
                    </div>

                    <a href="#" class="Link-esqueceu">Esqueci minha senha</a>

                    <button type="submit" class="btn-entrar">Entrar</button>

                    <a href="#" class="Link-instrucoes">Instruções</a>
                </form>
            </section>

            <section class="caixa-ilustracao">
                <img src="C:\Users\WEB2026\OneDrive\Área de Trabalho\projeto-portal-do-aluno-WEB\pagina incial\imagens\ChatGPT Image 25 de mai. de 2026, 16_20_44.png"
                    alt="Ilustração de Estudantes">
            </section>

        </main>

        <footer>
            <p>ufac.br</p>
            <p>V 2.0.202306021048 - Copyright &copy; 2023 ASTEN</p>
        </footer>

        <img src="C:\Users\WEB2026\OneDrive\Área de Trabalho\projeto-portal-do-aluno-WEB\pagina incial\imagens\ChatGPT Image 25 de mai. de 2026, 16_18_08.png"
            class="ondas-fundo" alt="">

    </div>

    <script src="script.js"></script>
</body>

</html>
