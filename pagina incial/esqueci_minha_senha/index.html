<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação de Acesso - UFAC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-decorations">
        <img src="../imagens/ondas.png" alt="Ondas de fundo" class="bg-ondas">
        <img src="../imagens/estudante_senha.png" alt="Estudante" class="bg-estudante">
    </div>

    <div class="main-container">
        <main>
            <div class="logo-container">
                <img src="../imagens/logo.png" alt="Logo da UFAC" width="220">
            </div>

            <h1>RECUPERAÇÃO DE ACESSO</h1>
            <p class="subtitle">Esqueceu sua senha? Sem problemas! Informe seu CPF para iniciarmos a recuperação.</p>

            <form>
                <div class="input-group">
                    <img src="../imagens/cracha.png" alt="ícone de crachá" width="24">
                    <div class="input-text-area">
                        <label>CPF</label>
                        <input type="text" placeholder="Digite seu CPF">
                    </div>
                </div>
                <p class="info-text">Um email com instruções e um link de redefinição de senha será enviado para o endereço cadastrado.</p>
                <button type="submit">Solicitar Recuperação</button>
            </form>

            <a href="/pagina incial/primeira_tela/index.html" class="back-link">Voltar para Login</a>
        </main>
    </div>
</body>

</html>
